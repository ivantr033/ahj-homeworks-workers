<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Workers Workshop - Offline Portal & Hasher Thread</title>
</head>

<body>

    <!-- WIDGET 1 & 3: LOADING STYLING + BUGGY SERVICE -->
    <div class="workshop-card-frame" id="news-widget-root">
        <div class="news-header-row">
            <h2 class="news-title">Новости мира кино</h2>
            <button class="btn-refresh-news" id="btn-trigger-refresh">Обновить</button>
        </div>

        <div id="news-feed-container">
            <!-- The skeletons or the real news will drop here -->
        </div>

        <!-- Offline contingency mask -->
        <div id="news-network-error-mask">
            <div>Не удалось загрузить данные</div>
            <div>Проверьте подключение</div>
            <div>и обновите страницу</div>
        </div>
    </div>

    <!-- WIDGET 2: STREAMING HASHER WITH WEB WORKER -->
    <div class="workshop-card-frame" id="hasher-widget-root">
        <div class="news-header-row">
            <h2 class="news-title">Hasher</h2>
        </div>

        <!-- Drag-and-drop zone -->
        <div class="hasher-dropzone" id="hasher-drag-zone">
            <div>Drop files here<br />or<br />Click to select</div>
            <input type="file" id="hasher-hidden-file-input" style="display: none;" />
        </div>

        <div class="hasher-controls-row">
            <span>Hash Algorithm:</span>
            <select class="hasher-select-menu" id="hasher-algorithm-selector">
                <option value="MD5">MD5</option>
                <option value="SHA1">SHA1</option>
                <option value="SHA256">SHA256</option>
                <option value="SHA512">SHA512</option>
            </select>
        </div>

        <div class="hasher-result-box">
            <div class="hasher-result-label">Calculated Hash:</div>
            <div class="hasher-hex-code" id="hasher-display-output">XXXXXXXXXXXXXXXXXXXXXXXX</div>
        </div>
    </div>

</body>

</html>
